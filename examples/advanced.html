<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orbital Rings Loader - Example</title>
    <style>
        body {
            margin: 0;
            padding: 40px;
            background: #000;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, Arial;
        }
        
        .demo-container {
            display: flex;
            flex-wrap: wrap;
            gap: 60px;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
        }
        
        .demo-item {
            text-align: center;
        }
        
        .demo-item h3 {
            margin-bottom: 30px;
            opacity: 0.7;
        }
        
        .loader-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 200px;
        }
        
        button {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
        }
        
        button:hover {
            background: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>
    <h1 style="text-align: center;">Orbital Rings Loader Examples</h1>
    
    <div class="demo-container">
        <!-- Basic loader -->
        <div class="demo-item">
            <h3>Basic Loader</h3>
            <div class="loader-wrapper" id="basic-loader"></div>
        </div>
        
        <!-- Progress loader -->
        <div class="demo-item">
            <h3>With Progress</h3>
            <div class="loader-wrapper" id="progress-loader"></div>
            <button onclick="simulateProgress()">Simulate Loading</button>
        </div>
        
        <!-- Custom colors -->
        <div class="demo-item">
            <h3>Custom Colors</h3>
            <div class="loader-wrapper" id="custom-loader"></div>
        </div>
        
        <!-- Small size -->
        <div class="demo-item">
            <h3>Small Size</h3>
            <div class="loader-wrapper" id="small-loader"></div>
        </div>
    </div>
    
    <script src="orbital-rings-loader.js"></script>
    <script>
        // Basic loader
        const basicLoader = new OrbitalRingsLoader({
            container: document.getElementById('basic-loader'),
            showProgress: false
        });
        
        // Progress loader
        let progressLoader = new OrbitalRingsLoader({
            container: document.getElementById('progress-loader'),
            showProgress: true,
            progress: 0
        });
        
        // Custom colors loader
        const customLoader = new OrbitalRingsLoader({
            container: document.getElementById('custom-loader'),
            colors: ['#FF0066', '#FF6600', '#FFCC00'],
            ringCount: 4,
            showProgress: false
        });
        
        // Small loader
        const smallLoader = new OrbitalRingsLoader({
            container: document.getElementById('small-loader'),
            size: 100,
            ringCount: 2,
            showProgress: false
        });
        
        // Progress simulation
        function simulateProgress() {
            let progress = 0;
            const interval = setInterval(() => {
                progress += Math.random() * 20;
                if (progress >= 100) {
                    progress = 100;
                    clearInterval(interval);
                    setTimeout(() => {
                        progressLoader.setProgress(0);
                    }, 1000);
                }
                progressLoader.setProgress(progress);
            }, 300);
        }
    </script>
</body>
</html>
